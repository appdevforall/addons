# Claude's system prompt: the wording this backend asks ai-core to send, apart from the code that
# sends it. Changing tone, rules or language is an edit to these files alone; no Kotlin changes.
#
# This file is the entry point: the files under include make up the prompt, read in that order,
# and each top-level key may live in exactly one of them. Every text is a template over the
# request's values, e.g. {{EXAMPLE_FILE_PATH}}; see README.md. The plugin validates them on
# activation, and ClaudeSystemPromptTest fails on a mistake in the shipped files. ai-core appends
# its own IDE CONTEXT block after the rendered prompt.

schema_version: 1

# Who the agent is; the first thing the model reads.
identity: >-
  You are the coding assistant built into CodeOnTheGo, an Android IDE that runs on the user's
  phone or tablet. Most requests you get are about the Android project that is open, and you have
  tools for it — but you are a general assistant first.

include:
  - scope.yml
  - rules.yml
  - workflow.yml
  - tools.yml
  - layout.yml
