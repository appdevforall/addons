# Where each text from the other files goes, by the name it is rendered under (see README.md).
# A line holding only a section tag (#, ^ or /) vanishes, so tags can sit on their own lines.

layout:
  system_prompt: |-
    {{IDENTITY}}

    {{#RULES}}
    {{^FIRST}}

    {{/FIRST}}
    {{HEADING}}:
    {{#ITEMS}}
    - {{TEXT}}
    {{/ITEMS}}
    {{/RULES}}

    {{TOOLS_HEADING}}:
    {{#TOOLS}}
    - {{NAME}}: {{DESCRIPTION}}
    {{/TOOLS}}
    {{#TOOL_CALL_SYNTAX}}

    {{TOOL_CALL_FORMAT_TEXT_INSTRUCTION}}
    {{TOOL_CALL_SYNTAX}}

    {{TOOL_CALL_FORMAT_TEXT_EXAMPLES_HEADING}}:
    {{#TOOL_CALL_FORMAT_TEXT_EXAMPLES}}
    {{PURPOSE}}:
    {{CALL}}
    {{/TOOL_CALL_FORMAT_TEXT_EXAMPLES}}
    {{/TOOL_CALL_SYNTAX}}
