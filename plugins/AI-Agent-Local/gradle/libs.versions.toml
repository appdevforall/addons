# Version catalog for AI Agent Local and its subprojects.
#
# This file was originally copied wholesale from the CodeOnTheGo app repo and
# carried 281 entries, of which 4 were ever referenced. The dead bulk had drifted
# into self-contradiction (androidx.core:core-ktx declared at three different
# versions, appcompat at two, gson at two) and was actively misleading, because
# it is the number a reader greps for. It has been pruned to what is actually
# used -- ADFA-4907.
#
# Only this plugin's llama-api and llama-impl subprojects consume this catalog,
# and its settings.gradle.kts includes them only when the llama.cpp submodule is
# checked out. The plugin's own build.gradle.kts uses literals, not aliases.
#
# agp/kotlin must match the classpath pinned in settings.gradle.kts; that
# agreement is enforced by scripts/check-toolchain.sh.

[versions]
agp = "8.11.0"
kotlin = "2.3.0"

# appcompat tracks the repo majority (21 modules) and matches the literal in
# this plugin's build.gradle.kts. Declaring 1.7.1 here while the parent module pinned
# 1.6.1 put two versions of one library in a single build.
appcompat = "1.6.1"
coreKtx = "1.13.1"

# One version for the whole kotlinx-coroutines family. llama-api pulled
# coroutines-core 1.10.2 while this plugin's build.gradle.kts pulled
# coroutines-android 1.8.1 -- the two artifacts are released as a set and must
# not be split across one build.
coroutines = "1.8.1"

slf4j = "2.0.12"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
