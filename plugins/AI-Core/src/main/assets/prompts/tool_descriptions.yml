# What each tool is for, as the model reads it in the tool list and in native tool definitions;
# the approval dialog shows the same description. The code keeps only each tool's name and the
# shape of its arguments. Every built-in tool must be described here, with every argument it takes.

# The tool the agent answers the user with, whatever it is named.
terminal_tool:
  description: >-
    Send the user your reply or final answer. It MUST carry a "message" holding the text itself —
    calling {{TERMINAL_TOOL}} with no "message" shows the user nothing.
  arguments:
    message: The reply to show the user.

# Keyed by tool name. A tool from another plugin brings its own description and is not listed.
built_in_tools:
  read_file:
    description: Read the contents of a file
    arguments:
      file_path: Project-relative path of the file to read.
  list_files:
    description: List files and directories in a given path
    arguments:
      directory: Project-relative directory to list. Empty or omitted lists the project root.
  search_project:
    description: Search for files by name or content in the project
    arguments:
      query: Text to search for; a file name unless searching contents.
      project_dir: Project-relative directory to search under. Defaults to the whole project.
      search_in_contents: Search inside files instead of matching their names.
  open_file:
    description: Open a file in the IDE editor
    arguments:
      file_path: Project-relative path of the file to open.
  read_build_output:
    description: Read the current build output and status
  create_file:
    description: Create a new file with given content
    arguments:
      file_path: Project-relative path of the file to create.
      content: The file's full contents.
  update_file:
    description: Update an existing file with new content
    arguments:
      file_path: Project-relative path of the file to overwrite.
      content: The file's new full contents.
  edit_file:
    description: >-
      Edit an existing file by replacing an exact snippet: give file_path, old_string (text to
      find, copied exactly including indentation) and new_string (its replacement; empty deletes
      it). old_string must match exactly once unless replace_all is true. Prefer this over
      update_file for changing a file.
    arguments:
      file_path: Project-relative path of the file to edit.
      old_string: The exact text to find, copied byte-for-byte from the file including indentation.
      new_string: What to put in its place; empty deletes it.
      replace_all: Replace every occurrence. When false the text must match exactly once.
  add_dependency:
    description: Add a Maven dependency to the project build file
    arguments:
      dependency: Maven coordinate to add, as group:artifact:version.
      build_file: Project-relative build file to add it to. Defaults to the app module's.
  run_app:
    # Success is weaker than "the app is running": the user still has to accept the system install
    # prompt, and without saying so the model reports the launch.
    description: >-
      Build the app and install it on this device. The user has to confirm a system install
      prompt, so success means the install started, not that the app is on screen
  gradle_sync:
    description: Sync the Gradle project (reload dependencies and rebuild cache)
  run_gradle_task:
    # Without "any task" small models still answer that they cannot run tests, and without the
    # second sentence Gemini answers a repeated "run the tests" from the earlier result.
    description: >-
      Run any Gradle task in the project — tests, lint, clean, assemble — and get back whether it
      passed and the build output, test failures and compiler errors included. A result from an
      earlier message is out of date: whenever the user asks to run a task, call this tool again
      instead of repeating that result. Unsure of a task's name? Call list_gradle_tasks first
    arguments:
      tasks: >-
        The Gradle tasks to run, separated by spaces, e.g. "test" or ":app:testDebugUnitTest".
      arguments: >-
        Gradle command-line arguments, separated by spaces, e.g. "--tests com.example.FooTest"
        or "--info". A task option such as --tests applies to the last task. Gradle skips a task
        whose inputs have not changed; add "--rerun" to run the last task anyway. Omit when there
        are none.
  list_gradle_tasks:
    # Without "custom tasks" models answer from Gradle and Android defaults and miss the project's own.
    description: >-
      List the Gradle tasks this project has, the project's own custom tasks included, with each
      task's path, group and what it does. Call it before run_gradle_task when you are unsure a
      task exists or which task does what the user asked
    arguments:
      filter: >-
        Text to search task paths, groups and descriptions for, e.g. ":app", "test" or "lint".
        Omit to list the tasks that have a group or a description.
  run_shell_command:
    # Without the second sentence models hand the user a script to run themselves (ADFA-6339);
    # without the third, Gemini ran "ls -la" when asked for "ls". The host runs each call in a
    # fresh bash, so a lone "cd" or "export" is lost before the next call.
    description: >-
      Run a shell command or script with bash in the IDE's Terminal and get back its exit code and
      output. Use it instead of asking the user to run a command. When the user gives the command,
      run it exactly as written, adding no flags or options they did not ask for. Each call starts
      a new shell, so cd and export do not carry over to the next call: use working_directory, or
      chain in one call, e.g. "cd app && ls src". A non-zero exit code can be the answer, e.g.
      grep exits 1 when nothing matches. A command still running after 30 seconds, such as a
      server, is left running and its output so far comes back. For a Gradle task use
      run_gradle_task, not ./gradlew
    arguments:
      command: >-
        The command or script to run with bash, e.g. "ls -la app/src" or several lines of script.
      working_directory: >-
        Project-relative directory to run in; it must be inside the project. Omit to run at the
        project root.
  read_terminal_session:
    description: >-
      Check on a command run_shell_command left running, such as a server: whether it still runs,
      its exit code once it stopped, and its latest output
    arguments:
      session: The Terminal session name the run_shell_command result reported.
  stop_terminal_session:
    # Its second sentence: Gemini stopped a ping it had just started, to finish the request.
    description: >-
      Stop a command run_shell_command left running, such as a server or ping, with Ctrl-C. Use it
      only when the user asks to stop, kill or cancel that command, never to finish a request that
      started it
    arguments:
      session: The Terminal session name the run_shell_command result reported.
  generate_from_template:
    description: Generate files from Pebble templates with variable substitution
    arguments:
      template_name: Name of the registered template to generate from.
      variables: Template variables, as a flat object of name to value.
  web_search:
    description: >-
      Search the web for current or outside information — news, releases, documentation, a
      library's latest version, whether an API is deprecated — and get back what the results say
      with their sources.
    arguments:
      query: >-
        What to look up, phrased as a search query: one claim per query, naming exactly the
        library, API or version it is about.
  fetch_url:
    # The user approves each fetch, so the description says it reaches the internet.
    description: >-
      Fetch a web page, repository page or raw file from the internet and return its text. Use it
      for a URL the user gives or one a web search found.
    arguments:
      url: The full http or https URL to fetch.
  read_app_logs:
    description: Read the App Logs of the user's running app, from the newest crash or error
    arguments:
      min_level: >-
        Lowest level to include: verbose, debug, info, warning or error. Defaults to all levels.
      filter: Case-insensitive text a line must contain, matched against its tag and message.
  read_ide_logs:
    description: Read the IDE Logs of Code on the Go and its plugins, from the newest error
    arguments:
      min_level: >-
        Lowest level to include: verbose, debug, info, warning or error. Defaults to all levels.
      filter: Case-insensitive text a line must contain, matched against its tag and message.
