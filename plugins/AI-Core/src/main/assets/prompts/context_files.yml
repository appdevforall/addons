# The files the user attached, appended to the message they were attached to. Belongs to the user
# turn rather than the system prompt; layout.yml's context_files decides how each file is framed.

context_files:
  heading: CONTEXT FILES
  # A file cut to the size limit, sent on every later turn too (ADFA-6345). HEAD and TAIL are its
  # start and end, verbatim; COUNT is how many characters were left out between them.
  truncated: |-
    {{HEAD}}
    …[truncated {{COUNT}} chars; call read_file on this file for the part left out]
    {{TAIL}}
